function lines(ss,h=240){const W=760,P=44,all=ss.flatMap(s=>s.d),mx=Math.max(...all),mn=Math.min(0,...all),y=v=>h-24-(v-mn)/(mx-mn||1)*(h-40),x=i=>P+i*(W-P-10)/11;
 let s='<svg viewBox="0 0 '+W+' '+h+'" width="100%">';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+='<line x1="'+P+'" x2="'+(W-10)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--bd)"/><text x="'+(P-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+M(v)+'</text>'}
 MES.forEach((n,i)=>s+='<text x="'+x(i)+'" y="'+(h-8)+'" text-anchor="middle">'+n+'</text>');
 ss.forEach(q=>{s+='<polyline fill="none" stroke="'+q.c+'" stroke-width="2.4" points="'+q.d.map((v,i)=>x(i)+','+y(v)).join(' ')+'"/>'+q.d.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+q.c+'"><title>'+q.n+' '+MES[i]+': '+M(v)+' M</title></circle>').join('')});return s+'</svg>'}
function bars(items,ks){const W=760,P=150,mx=Math.max(...items.flatMap(i=>ks.map(k=>i.v[k])),1),bh=14,gap=10,rh=ks.length*bh+gap;let s='<svg viewBox="0 0 '+W+' '+(items.length*rh+10)+'" width="100%">';
 items.forEach((it,j)=>{const y0=j*rh+4;s+='<text x="'+(P-6)+'" y="'+(y0+bh+2)+'" text-anchor="end">'+esc(it.l.length>24?it.l.slice(0,23)+'…':it.l)+'</text>';ks.forEach((k,q)=>{const w=Math.max(1,Math.max(it.v[k],0)/mx*(W-P-70));s+='<rect x="'+P+'" y="'+(y0+q*bh)+'" width="'+w+'" height="'+(bh-2)+'" rx="2" fill="'+CL[k]+'"><title>'+esc(it.l)+' · '+KL[k]+': '+M(it.v[k])+' M</title></rect><text x="'+(P+w+4)+'" y="'+(y0+q*bh+10)+'">'+M(it.v[k])+'</text>'})});return s+'</svg>'}
function kpi(n){const r=R[n];return '<div class="card kpi"><div class="lab"><b style="color:'+CL[n]+'">'+n+'</b>'+(n==='Optimista'?' · sin Kabi desde marzo, otros clientes lo reemplazan':' · sin Kabi desde marzo, sin reemplazo')+'</div><div class="val">'+M(r.ut)+' <span class="sub">utilidad del período</span></div><div class="sub">Ventas '+M(r.v)+' · costos y gastos '+M(r.tc)+' · margen neto <b>'+PC(r.ut/r.v)+'</b></div><div class="sub">vs 2026 anualizado: ventas '+DL(r.v-R.b26.v)+' ('+PC((r.v-R.b26.v)/R.b26.v)+') · utilidad '+DL(r.ut-R.b26.ut)+'</div></div>'}
function group(fn){const o={};RW().forEach(r=>{const k=fn(r);(o[k]=o[k]||{b26:0,Optimista:0,Pesimista:0,fij:0});o[k].b26+=r[9];o[k].Optimista+=sum(r[10]);o[k].Pesimista+=sum(r[11]);if(r[5]==='Fijos')o[k].fij+=r[9]});return o}
function tbl(g,cols,extra){const ks=Object.keys(g).sort((a,b)=>g[b].Optimista-g[a].Optimista),t={b26:0,Optimista:0,Pesimista:0,fij:0};ks.forEach(k=>KS.concat('fij').forEach(c=>t[c]+=g[k][c]));
 return '<div class="tw"><table><tr><th>'+cols+'</th><th class="n">Fijo 2026</th><th class="n">Variable 2026</th><th class="n">2026 anualizado</th><th class="n">Optimista</th><th class="n">Pesimista</th><th class="n">Δ Opt</th><th class="n">Δ Pes</th></tr>'+
 ks.map(k=>{const a=g[k];return '<tr><td><b>'+esc(extra?extra(k):k)+'</b></td><td class="n">'+M(a.fij)+'</td><td class="n">'+M(a.b26-a.fij)+'</td><td class="n">'+M(a.b26)+'</td><td class="n">'+M(a.Optimista)+'</td><td class="n">'+M(a.Pesimista)+'</td><td class="n">'+DL(a.Optimista-a.b26)+'</td><td class="n">'+DL(a.Pesimista-a.b26)+'</td></tr>'}).join('')+
 '<tr><td><b>Total</b></td><td class="n"><b>'+M(t.fij)+'</b></td><td class="n"><b>'+M(t.b26-t.fij)+'</b></td><td class="n"><b>'+M(t.b26)+'</b></td><td class="n"><b>'+M(t.Optimista)+'</b></td><td class="n"><b>'+M(t.Pesimista)+'</b></td><td class="n"><b>'+DL(t.Optimista-t.b26)+'</b></td><td class="n"><b>'+DL(t.Pesimista-t.b26)+'</b></td></tr></table></div>'}
function topN(g,n){return Object.keys(g).sort((a,b)=>g[b].Optimista-g[a].Optimista).slice(0,n).map(k=>({l:k,v:g[k]}))}
function show(){nav();calc();document.getElementById('rbtn').textContent=S.res?'Quitar reserva de Presidencia':'Incluir reserva de Presidencia';document.getElementById('rbtn').style.borderColor=S.res?'':'var(--pe)';document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='t-'+tab));const E=id=>document.getElementById(id);
 if(tab==='resumen'){const rr=[['Ventas','v'],['Costos','c'],['Utilidad bruta','ub'],['Gastos Admon','ga'],['Gastos Ventas','gv'],['Reserva Presidencia','rp'],['Utilidad operacional','uo'],['Gastos No Ope','gn'],['Ingresos no operacionales','no'],['UTILIDAD DEL PERÍODO','ut']];
  E('t-resumen').innerHTML='<div class="g">'+kpi('Optimista')+kpi('Pesimista')+'<div class="card kpi"><div class="lab">Base 2026 anualizado (Integra a oct ×12/10 · Orión a sep ×12/9) + reserva de Presidencia 2026 (presupuestada)</div><div class="val">'+M(R.b26.ut)+' <span class="sub">utilidad del período</span></div><div class="sub">Ventas '+M(R.b26.v)+' · costos y gastos '+M(R.b26.tc)+' · margen neto '+PC(R.b26.ut/R.b26.v)+'</div></div></div>'+
  '<div class="card"><h2>P&G 2027 por escenario (millones)</h2><div class="tw"><table><tr><th></th><th class="n">2026 anualizado</th><th class="n">Optimista</th><th class="n">Pesimista</th><th class="n">Opt − Pes</th></tr>'+
  rr.map(x=>{const b=['ub','uo','ut','v'].includes(x[1]);const f=v=>b?'<b>'+M(v)+'</b>':M(v);return '<tr><td>'+(b?'<b>'+x[0]+'</b>':x[0])+'</td><td class="n">'+f(R.b26[x[1]])+'</td><td class="n">'+f(R.Optimista[x[1]])+'</td><td class="n">'+f(R.Pesimista[x[1]])+'</td><td class="n">'+DL(R.Optimista[x[1]]-R.Pesimista[x[1]])+'</td></tr>'}).join('')+
  '<tr><td>Margen operacional %</td><td class="n">'+PC(R.b26.uo/R.b26.v)+'</td><td class="n">'+PC(R.Optimista.uo/R.Optimista.v)+'</td><td class="n">'+PC(R.Pesimista.uo/R.Pesimista.v)+'</td><td></td></tr><tr><td>Margen neto %</td><td class="n">'+PC(R.b26.ut/R.b26.v)+'</td><td class="n">'+PC(R.Optimista.ut/R.Optimista.v)+'</td><td class="n">'+PC(R.Pesimista.ut/R.Pesimista.v)+'</td><td></td></tr></table></div><div class="note">Mismo formato del P&G de ejecución. '+(S.res?'Incluye la reserva de Presidencia (≈'+M(RESV)+' M, −35% sobre la de 2026 de '+M(6625444411)+' M; con la reserva completa la utilidad baja '+M(6625444411-RESV)+' M)':'<b>SIN reserva de Presidencia</b> (con ella, ≈'+M(RESV)+' M menos de utilidad)')+' y la directriz de nómina (+'+M(D.P.nomina*12)+' M). Excluidos renta, pérdida en viajes/ventas e inversión nueva; ingresos no operacionales planos.</div></div>'+
  '<div class="card"><h2>Utilidad mensual (ventas − costos y gastos, sin no operacionales)</h2>'+leg(['Optimista','Pesimista'])+lines(['Optimista','Pesimista'].map(n=>({n,c:CL[n],d:mV(n).map((v,i)=>v-mCost(n)[i])})))+'<div class="note">Desde marzo sale Kabi (≈'+M(sum(Object.values(D.kabi))*1.2/12)+' M/mes de ventas en 2027): el pesimista pierde esas ventas; en ambos escenarios se retiran sus costos fijos (≈'+M(KF)+' M en el año).</div></div>'}
 if(tab==='mensual'){E('t-mensual').innerHTML=['Optimista','Pesimista'].map(n=>{const v=mV(n),c=mCost(n),u=v.map((x,i)=>x-c[i]);return '<div class="card"><h2 style="color:'+CL[n]+'">'+n+' — mes a mes (millones)</h2><div class="tw"><table><tr><th></th>'+MES.map(x=>'<th class="n">'+x+'</th>').join('')+'<th class="n">Total</th></tr>'+
   [['Ventas',v],['Costos y gastos',c],['Utilidad (sin no operacionales)',u]].map(r=>'<tr><td><b>'+r[0]+'</b></td>'+r[1].map(x=>'<td class="n">'+M(x)+'</td>').join('')+'<td class="n"><b>'+M(sum(r[1]))+'</b></td></tr>').join('')+'</table></div></div>'}).join('')+
   '<div class="card"><h2>Ventas mensuales</h2>'+leg(['Optimista','Pesimista'])+lines(['Optimista','Pesimista'].map(n=>({n,c:CL[n],d:mV(n)})))+'</div>'}
 if(tab==='unidades'){const g=group(r=>r[6]),b=D.base;
  E('t-unidades').innerHTML='<div class="card"><h2>P&G por unidad de negocio (millones)</h2><div class="tw"><table><tr><th>Unidad</th><th class="n">Ventas 2026</th><th class="n">Ventas Opt</th><th class="n">Ventas Pes</th><th class="n">Costos 2026</th><th class="n">Costos Opt</th><th class="n">Costos Pes</th><th class="n">Margen 2026</th><th class="n">Margen Opt</th><th class="n">Margen Pes</th></tr>'+
  LIN.concat('General').map(u=>{const vb=u==='General'?0:b[u],vo=u==='General'?0:sum(D.vm.Optimista[u]),vp=u==='General'?0:sum(D.vm.Pesimista[u]),a=g[u]||{b26:0,Optimista:0,Pesimista:0};return '<tr><td><b>'+u+'</b></td><td class="n">'+M(vb)+'</td><td class="n">'+M(vo)+'</td><td class="n">'+M(vp)+'</td><td class="n">'+M(a.b26)+'</td><td class="n">'+M(a.Optimista)+'</td><td class="n">'+M(a.Pesimista)+'</td><td class="n">'+M(vb-a.b26)+'</td><td class="n">'+M(vo-a.Optimista)+'</td><td class="n">'+M(vp-a.Pesimista)+'</td></tr>'}).join('')+'</table></div><div class="note">Los costos de General (administrativos y Over-Head de Orión) no se reparten entre unidades. Carga Masiva incluye Transporte de Carga y Agencia de Orión.</div></div>'+
  '<div class="card"><h2>Ventas por línea</h2>'+leg(KS)+bars(LIN.filter(u=>b[u]>0).map(u=>({l:u,v:{b26:b[u],Optimista:sum(D.vm.Optimista[u]),Pesimista:sum(D.vm.Pesimista[u])}})),KS)+'</div>'+
  '<div class="card"><h2>Kabi y cobertura por línea (millones)</h2><div class="tw"><table><tr><th>Línea</th><th class="n">Real Integra</th><th class="n">Real Orión</th><th class="n">Base anualizada</th><th class="n">Ventas Kabi anualizado</th><th class="n">% Kabi</th></tr>'+LIN.map(u=>'<tr><td><b>'+u+'</b></td><td class="n">'+M(D.baseI[u])+'</td><td class="n">'+M(D.baseO[u])+'</td><td class="n">'+M(D.base[u])+'</td><td class="n">'+M(D.kabi[u])+'</td><td class="n">'+(D.base[u]?PC(D.kabi[u]/D.base[u]):'—')+'</td></tr>').join('')+'</table></div><div class="note">Real Integra ene–oct y Orión ene–sep, sin anualizar en las dos primeras columnas. Costos fijos de Kabi (cuentas con cliente Fresenius Kabi): '+M(sum(D.rows.map(r=>r[12])))+' M anualizados, se retiran desde marzo en ambos escenarios (ahorro ≈ '+M(KF)+' M en 2027).</div></div>'}
 if(tab==='resp'){const g=group(r=>r[7]),ga=group(r=>r[8]);
  E('t-resp').innerHTML='<div class="card"><h2>Costos y gastos por área (millones)</h2>'+leg(KS)+bars(topN(ga,12),KS)+tbl(ga,'Área')+'<div class="note">Orión aparece como «Orión (por definir)» hasta tener su detalle por área.</div></div>'}
 if(tab==='grupos'){const g=group(r=>r[3]);E('t-grupos').innerHTML='<div class="card"><h2>Costos y gastos por grupo (millones)</h2>'+leg(KS)+bars(topN(g,10),KS)+'<div class="note">Los 10 mayores.</div></div><div class="card">'+tbl(g,'Grupo')+'</div>'}
 if(tab==='cuentas'){rC()}
 if(tab==='supuestos'){E('t-supuestos').innerHTML='<div class="card"><h2>Lineamientos recibidos</h2><ul><li><b>Ventas:</b> +'+(D.P.crec*100)+'% sobre el real 2026 anualizado, uniendo Orión e Integra por línea de negocio.</li><li><b>Costos:</b> fijos +'+(D.P.fijos*100)+'%; variables = % sobre ventas de 2026 (por unidad) × ventas 2027.</li><li><b>Escenarios:</b> ambos sin Kabi desde marzo. <b>Optimista:</b> el +20% se logra igual (otros clientes reemplazan a Kabi). <b>Pesimista:</b> sin reemplazo; a las ventas +20% se les resta Kabi desde marzo.</li></ul></div>'+
  '<div class="card"><h2>Supuestos de cálculo</h2><ul><li>Real 2026: Integra ene–oct (×12/10), Orión ene–sep (×12/9; falta octubre de Orión).</li><li>Presupuesto construido por cuenta contable × área × unidad (1.033 filas) desde los movimientos reales; fijo/variable según la columna «Tipo» de los libros de costos.</li><li><b>Kabi:</b> se retiran sus costos fijos (cuentas con cliente Fresenius Kabi: personal, arriendo de bodega, montacargas, servicios…) desde marzo en ambos escenarios; sus ventas las pierde el pesimista y el optimista las reemplaza con otros clientes.</li><li>Ventas y fijos parejo en 12 meses (sin estacionalidad).</li><li>Excluidos como en el dash de ejecución: Renta, Pérdida en viajes/ventas, Inv. Nueva. Reserva de Presidencia incluida (2026 con su perfil mensual, −35%, editable en el Excel). Ingresos no operacionales planos.</li><li>Orión: Transporte de Carga y Agencia → Carga Masiva; Over-Head → General; base bruta, sin eliminar operaciones entre empresas.</li><li>Directriz de nómina: +$1.689.600/mes (+$20,3 M/año) en la cuenta 513520, Tecnología, General, en ambos escenarios. Pendiente: homologación de cuentas de Orión.</li><li>Excel con fórmulas vivas y parámetros editables: <code>Presupuesto_2027_Escenarios.xlsx</code>.</li></ul></div>'}}
function opts(k,f,cur){const v=[...new Set(RW().map(f))].sort();return '<select onchange="S.'+k+'=this.value;S.n=150;rC()"><option value="">'+({cu:'Todas las unidades',cr:'Todas las áreas',cg:'Todos los grupos'}[k])+'</option>'+v.map(x=>'<option '+(x===cur?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>'}
function rC(){const q=S.cq.toLowerCase();let f=RW().filter(r=>(!S.cu||r[6]===S.cu)&&(!S.cr||r[7]===S.cr)&&(!S.cg||r[3]===S.cg)&&(!q||(r[1]+' '+r[2]+' '+r[3]).toLowerCase().includes(q)));
 f=f.sort((a,b)=>val(b,'Optimista')-val(a,'Optimista'));const t=n=>sum(f.map(r=>val(r,n)));
 document.getElementById('t-cuentas').innerHTML='<div class="card"><h2>Presupuesto por cuenta contable × área × unidad (millones)</h2><div class="filters">'+opts('cu',r=>r[6],S.cu)+opts('cr',r=>r[7],S.cr)+opts('cg',r=>r[3],S.cg)+'<input placeholder="Buscar cuenta, nombre o grupo" value="'+esc(S.cq)+'" oninput="S.cq=this.value;S.n=150;rC();this.focus()" id="cqi"></div>'+
 '<div class="note" style="margin-bottom:6px">'+f.length+' filas · ordenadas por el valor Optimista · total 2026 '+M(t('b26'))+' · Optimista '+M(t('Optimista'))+' · Pesimista '+M(t('Pesimista'))+'</div><div class="tw"><table><tr><th>Cuenta</th><th>Nombre</th><th>Grupo</th><th>Tipo</th><th>Unidad</th><th>Área</th><th>Empresa</th><th class="n">2026 anualiz.</th><th class="n">Optimista</th><th class="n">Pesimista</th><th class="n">Δ Opt</th></tr>'+
 f.slice(0,S.n).map(r=>'<tr><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+r[5]+'</td><td>'+r[6]+'</td><td>'+esc(r[7])+'</td><td>'+r[0]+'</td><td class="n">'+M(r[9])+'</td><td class="n">'+M(sum(r[10]))+'</td><td class="n">'+M(sum(r[11]))+'</td><td class="n">'+DL(sum(r[10])-r[9])+'</td></tr>').join('')+'</table></div>'+(f.length>S.n?'<button class="th" style="margin-top:8px" onclick="S.n+=300;rC()">Ver más ('+(f.length-S.n)+')</button>':'')+'</div>'}
show();
</script><!--dash-version--><div id="dash-version" aria-hidden="true" style="position:fixed;left:8px;bottom:5px;z-index:9999;font:10px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;color:inherit;opacity:.5;pointer-events:none;user-select:none">® DN · v3.0</div><!--/dash-version--></body></html>
