 if(tab==='lineas'){const b=D.base,k=D.kabi;
  document.getElementById('t-lineas').innerHTML='<div class="card"><h2>Ventas por línea de negocio (Orión + Integra)</h2><div class="tw"><table><tr><th>Línea</th><th class="n">2026 anualizado</th><th class="n">+20% (Optimista)</th><th class="n">Kabi 2026 anualizado</th><th class="n">Pesimista 2027</th><th class="n">Δ Pes vs Opt</th></tr>'+
   LIN.map(L=>{const o=sum(D.esc.Optimista.vm[L]),p=sum(D.esc.Pesimista.vm[L]);return '<tr><td><b>'+L+'</b></td><td class="n">'+M(b[L])+'</td><td class="n">'+M(o)+'</td><td class="n">'+M(k[L])+'</td><td class="n">'+M(p)+'</td><td class="n p">'+DL(p-o)+'</td></tr>'}).join('')+
   '<tr><td><b>Total</b></td><td class="n"><b>'+M(B26.ing)+'</b></td><td class="n"><b>'+M(R.Optimista.ing)+'</b></td><td class="n"><b>'+M(sum(Object.values(k)))+'</b></td><td class="n"><b>'+M(R.Pesimista.ing)+'</b></td><td class="n p"><b>'+DL(R.Pesimista.ing-R.Optimista.ing)+'</b></td></tr></table></div><div class="note">Carga Masiva incluye Transporte de Carga y Agencia de Carga Int. de Orión ('+M(D.emp.O.ing)+' M anualizado); Over-Head de Orión va a General.</div></div>'+
   '<div class="card"><h2>Ventas por línea</h2>'+leg(['b26','Optimista','Pesimista'])+bars(LIN.filter(L=>b[L]>0).map(L=>({l:L,v:{b26:b[L],Optimista:sum(D.esc.Optimista.vm[L]),Pesimista:sum(D.esc.Pesimista.vm[L])}})),['b26','Optimista','Pesimista'])+'</div>'}
 if(tab==='grupos'){const gs=Object.keys(D.esc.Optimista.cg).map(g=>({l:g,v:{b26:(D.fijoG[g]||0)+(D.varG[g]||0),Optimista:sum(D.esc.Optimista.cg[g]),Pesimista:sum(D.esc.Pesimista.cg[g])}})).sort((a,b)=>b.v.Optimista-a.v.Optimista);
  document.getElementById('t-grupos').innerHTML='<div class="card"><h2>Costos y gastos por grupo</h2>'+leg(['b26','Optimista','Pesimista'])+bars(gs.slice(0,10),['b26','Optimista','Pesimista'])+'<div class="note">Los 10 mayores. Pasa el cursor para ver el valor.</div></div><div class="card"><div class="tw"><table><tr><th>Grupo</th><th class="n">Fijo 2026</th><th class="n">Variable 2026</th><th class="n">2026 anualizado</th><th class="n">Optimista</th><th class="n">Pesimista</th></tr>'+
   gs.map(g=>'<tr><td><b>'+g.l+'</b></td><td class="n">'+M(D.fijoG[g.l]||0)+'</td><td class="n">'+M(D.varG[g.l]||0)+'</td><td class="n">'+M(g.v.b26)+'</td><td class="n">'+M(g.v.Optimista)+'</td><td class="n">'+M(g.v.Pesimista)+'</td></tr>').join('')+
   '<tr><td><b>Total</b></td><td class="n"><b>'+M(D.costo26.fijo)+'</b></td><td class="n"><b>'+M(D.costo26.var)+'</b></td><td class="n"><b>'+M(B26.cos)+'</b></td><td class="n"><b>'+M(R.Optimista.cos)+'</b></td><td class="n"><b>'+M(R.Pesimista.cos)+'</b></td></tr></table></div></div>'}
 if(tab==='supuestos'){document.getElementById('t-supuestos').innerHTML='<div class="card"><h2>Lineamientos recibidos</h2><ul><li><b>Ventas:</b> +20% sobre el real 2026 anualizado, uniendo Orión e Integra por línea de negocio.</li><li><b>Costos:</b> fijos +8% sobre el real 2026 anualizado; variables = % sobre ventas de 2026 (por línea) × ventas 2027.</li><li><b>Escenarios:</b> ambos sin Kabi desde marzo. <b>Optimista:</b> el +20% se logra igual (otros clientes reemplazan a Kabi). <b>Pesimista:</b> sin reemplazo; a las ventas +20% se les resta Kabi desde marzo.</li></ul></div>'+
  '<div class="card"><h2>Supuestos de cálculo</h2><ul><li>Real 2026: Integra ene–oct (×12/10) y Orión ene–sep (×12/9; falta octubre de Orión).</li><li>Variables: Fletes, Serv. Complem. Transp., Servicios de Mensajería, Impuestos (ICA/GMF) y las cuentas marcadas «Variables» en los libros de costos; el resto es fijo.</li><li>Kabi (Fresenius Kabi Colombia): ventas 2026 por línea de la hoja Kabi de Ingresos acumulados; el costo variable de Kabi sale proporcional a su venta; <b>los costos fijos asociados a Kabi (bodega, montacargas) se mantienen</b>: eliminarlos mejora el pesimista.</li><li>Ventas distribuidas parejo en 12 meses (sin estacionalidad); fijos +8% también parejo.</li><li>Excluidos como en el dash de ejecución: Renta, Pérdida en viajes/ventas, Inv. Nueva. Ingresos no operacionales planos.</li><li>Orión: Transporte de Carga y Agencia → Carga Masiva; Over-Head → General (Orión absorbida por Integra). Base bruta (flete en ingresos y costos); no se eliminan operaciones entre las dos empresas.</li><li>Pendiente: sin reserva de Presidencia ni homologación de cuentas de Orión.</li></ul></div>'}}
show();
