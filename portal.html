<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboards · Logística Integra</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#14171c;--ink2:#555b66;--muted:#8b919c;--line:#e6e8ee;--acc:#5fa01f;--acc2:#7cc22b;--accsoft:#eaf5dc;--side:#0e1913;--side2:#16251c;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f0d;--card:#151b18;--ink:#eef1ee;--ink2:#b3bab5;--muted:#7f8984;--line:#232c27;--accsoft:#1d2c14;--shadow:none}}
:root[data-theme="dark"]{--bg:#0b0f0d;--card:#151b18;--ink:#eef1ee;--ink2:#b3bab5;--muted:#7f8984;--line:#232c27;--accsoft:#1d2c14;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:radial-gradient(circle at 20% 0,#1b3324 0,var(--side) 55%);color:#e9efe9;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:12px 12px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc2),#2f7d32);display:grid;place-items:center;font-weight:800;color:#0e1913;font-size:20px}
.brand b{display:block;letter-spacing:.14em;font-size:13px}.brand span{font-size:11px;color:#9fb3a5;letter-spacing:.08em}
.sec{font-size:11px;letter-spacing:.16em;color:#7e9486;padding:10px 12px 6px}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#dfe8e0;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.06)}nav button.on{background:rgba(124,194,43,.16);color:#fff;box-shadow:inset 3px 0 0 var(--acc2)}
nav .ic{width:22px;text-align:center}nav .n{margin-left:auto;background:#f0a21a;color:#2b1c00;font-weight:700;font-size:12px;border-radius:999px;padding:1px 9px}
nav button.on .n{background:var(--acc2);color:#0e1913}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;font-size:12px;color:#8ea396}
.date{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.ver{text-align:center;letter-spacing:.14em;font-weight:700;color:#6f8577;font-size:11px}
main{padding:0 0 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;position:sticky;top:0;z-index:5}
.top .t1{font-size:12px;letter-spacing:.12em;color:var(--muted)}.top .t2{font-size:19px;font-weight:700;letter-spacing:.02em}
.top .sp{flex:1}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.pill.ok{background:var(--accsoft);color:var(--acc);border-color:transparent}
.search{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 14px;font:inherit;min-width:230px}
.burger{display:none}
.in{padding:28px}
h1{font-size:34px;margin:0;letter-spacing:-.02em}.sub{color:var(--ink2);margin:4px 0 22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:22px}
.box h3{margin:0 0 4px;font-size:18px}.box p{margin:0 0 12px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
h2.a{font-size:13px;letter-spacing:.14em;color:var(--muted);margin:26px 0 12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;color:inherit;text-decoration:none;box-shadow:var(--shadow);position:relative;transition:.15s}
a.card:hover{transform:translateY(-3px);border-color:var(--acc2)}
.ico{width:48px;height:48px;border-radius:14px;background:var(--accsoft);display:grid;place-items:center;font-size:24px}
.t{font-weight:700;font-size:17px;padding-right:30px}.d{color:var(--ink2);font-size:14px;flex:1}
.m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{background:var(--accsoft);color:var(--acc);border-radius:999px;padding:2px 10px;font-weight:700}
.go{margin-left:auto;background:var(--acc);color:#fff;border-radius:12px;padding:8px 16px;font-weight:700;font-size:14px}
a.card:hover .go{background:var(--acc2);color:#0e1913}
.fav{position:absolute;top:12px;right:12px;border:0;background:none;font-size:20px;color:var(--line);cursor:pointer;padding:2px 6px}.fav.on{color:#f0a21a}
.none{color:var(--muted);padding:30px 0}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;left:-290px;width:270px;z-index:20;transition:.2s}aside.open{left:0}.burger{display:inline-flex}.in{padding:18px}.top{padding:12px 16px}h1{font-size:26px}.search{min-width:0;flex:1}}
</style></head><body><div class="app">
<aside id="side"><div class="brand"><div class="logo">I</div><div><b>LOGÍSTICA INTEGRA</b><span>Tranquilo, en logística estamos contigo</span></div></div>
<div class="sec">ELEGIR ÁREA</div><nav id="nav"></nav>
<div class="side-foot"><div class="date"><span>FECHA SISTEMA</span><b id="hoy"></b></div><div class="ver">PORTAL DE DASHBOARDS · ® DN</div></div></aside>
<main><div class="top"><button class="pill burger" id="bg">☰</button><div><div class="t1">LOGÍSTICA INTEGRA</div><div class="t2" id="crumb">INICIO</div></div><div class="sp"></div>
<input class="search" id="q" type="search" placeholder="Buscar dashboard…"><span class="pill ok">● <span id="cnt"></span></span><button class="pill" id="theme">◐ Tema</button></div>
<div class="in"><h1 id="hi"></h1><div class="sub" id="fecha"></div>
<div class="box"><h3>¿Qué quieres consultar?</h3><p>Elige un área y verás sus dashboards. Puedes volver aquí desde cualquier dash con el botón «← Dashboards».</p><div class="chips" id="chips"></div></div>
<div id="app"></div></div></main></div>
<script>
const D={"areas": ["Finanzas", "Fletes y operaciones", "Presupuesto 2027", "Renta e impuestos", "Otros"], "items": [{"area": "Otros", "titulo": "Presupuesto vs Ejecución · Orion", "desc": "P&G de Orion con ingresos, costos y medidores de ejecución.", "tag": "Acumulado", "href": "../9f170ffb3ce35452c9980ee5/", "upd": "2026-11-12"}, {"area": "Otros", "titulo": "Presupuesto vs Ejecución 2026 · Integra", "desc": "P&G de Integra: presupuesto contra real, comparar meses, cuentas y saldos.", "tag": "Acumulado", "href": "../cce94e517d02d24aeca59727/", "upd": "2026-11-18"}, {"area": "Presupuesto 2027", "titulo": "Presupuesto 2027", "desc": "Presupuesto 2027 por empresa, área y cuenta.", "tag": "Presupuesto", "href": "../6c06d5da8f0b9985d43a009c/", "upd": "2026-11-12"}, {"area": "Fletes y operaciones", "titulo": "Validación de tarifas y flota", "desc": "Manifiestos, rutas, ocupación y validación de tarifas.", "tag": "Análisis", "href": "../2970bac30d4043fcd10021e1/", "upd": "2026-11-12"}, {"area": "Fletes y operaciones", "titulo": "Fletes · Semanal", "desc": "Costo de fletes por semana contra presupuesto, por cliente y regional.", "tag": "Semanal", "href": "../0ed0eef4363c1191e7643d55/", "upd": "2026-11-20"}, {"area": "Otros", "titulo": "Entidad 2026", "desc": "Real anual de la entidad contra presupuesto (solo Costos totales).", "tag": "Acumulado", "href": "../7a4ae95b82622add07904541/", "upd": "2026-11-18"}, {"area": "Fletes y operaciones", "titulo": "Fletes · Acumulado anual 2026", "desc": "Fletes del año (manifiestos vs contables) contra presupuesto, por mes.", "tag": "Acumulado", "href": "../00636f6c3f37d6cdee8b1a66/", "upd": "2026-11-18"}, {"area": "Presupuesto 2027", "titulo": "Escenarios 2027", "desc": "Escenarios optimista / medio / pesimista, reservas e IPC.", "tag": "Escenarios", "href": "../2722250ac6198dd41a8cf181/", "upd": "2026-11-23"}, {"area": "Renta e impuestos", "titulo": "Renta 2026", "desc": "Provisión de renta 2026: a cargo, a pagar y anticipos.", "tag": "Acumulado", "href": "../a1b52f41b6abe78a4cc90b49/", "upd": "2026-11-26"}, {"area": "Finanzas", "titulo": "Consumo del ingreso 2026", "desc": "Qué % del ingreso consumen proveedores, servicios y personal, impuestos y socios; utilidad. Top 5 y descarga.", "tag": "Acumulado", "href": "../9b17393edf2466871c14a204/", "upd": "2026-11-27"}]};let area="Todas",q="",favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"))}catch(e){}
const IC={"Todas":"🏠","Favoritos":"⭐","Finanzas":"📊","Fletes y operaciones":"🚚","Presupuesto 2027":"🎯","Renta e impuestos":"🧾","Otros":"🗂️"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=i=>document.getElementById(i);
const now=new Date(),h=now.getHours();
$("hi").textContent=(h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches");
const f=now.toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("fecha").textContent=f.charAt(0).toUpperCase()+f.slice(1)+" · "+D.items.length+" dashboards en "+D.areas.length+" áreas";
$("hoy").textContent=now.toLocaleDateString("es-CO");
const count=a=>a==="Todas"?D.items.length:a==="Favoritos"?D.items.filter(c=>favs.has(c.titulo)).length:D.items.filter(c=>c.area===a).length;
function menu(){const L=["Todas","Favoritos",...D.areas];
 $("nav").innerHTML=L.map(a=>`<button data-a="${a}" class="${a===area?'on':''}"><span class="ic">${IC[a]||"📁"}</span>${a==="Todas"?"Todos":a}<span class="n">${count(a)}</span></button>`).join("");
 $("chips").innerHTML=L.filter(a=>a!=="Favoritos").map(a=>`<button data-a="${a}" class="${a===area?'on':''}">${IC[a]||""} ${a==="Todas"?"Todos":a}</button>`).join("");
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{area=b.dataset.a;$("side").classList.remove("open");menu();draw();window.scrollTo(0,0)});
 $("crumb").textContent=(area==="Todas"?"INICIO":area.toUpperCase());$("cnt").textContent=count(area)+" dashboards";}
function card(c){return `<a class="card" href="${c.href}"><button class="fav ${favs.has(c.titulo)?'on':''}" data-f="${esc(c.titulo)}">★</button><div class="ico">${IC[c.area]||"📁"}</div><div class="t">${esc(c.titulo)}</div><div class="d">${esc(c.desc)}</div><div class="m"><span class="tag">${esc(c.tag)}</span><span>${c.upd?"Act. "+c.upd:""}</span><span class="go">Abrir →</span></div></a>`}
function draw(){const s=q.toLowerCase();
 const it=D.items.filter(c=>(area==="Todas"||(area==="Favoritos"?favs.has(c.titulo):c.area===area))&&(!s||(c.titulo+" "+c.desc+" "+c.tag+" "+c.area).toLowerCase().includes(s)));
 let o="";if(!it.length)o=`<div class="none">${area==="Favoritos"?"Aún no marcaste favoritos (★).":"Sin resultados."}</div>`;
 else if(area==="Todas"||area==="Favoritos"||s){D.areas.forEach(a=>{const x=it.filter(c=>c.area===a);if(x.length)o+=`<h2 class="a">${IC[a]||""} ${a}</h2><div class="grid">${x.map(card).join("")}</div>`})}
 else o=`<div class="grid">${it.map(card).join("")}</div>`;
 $("app").innerHTML=o;
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const t=b.dataset.f;favs.has(t)?favs.delete(t):favs.add(t);try{localStorage.setItem("favs",JSON.stringify([...favs]))}catch(x){}menu();draw();});}
$("q").oninput=e=>{q=e.target.value;draw()};$("bg").onclick=()=>$("side").classList.toggle("open");
$("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";};
menu();draw();
</script></body></html>
