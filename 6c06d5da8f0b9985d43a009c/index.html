  if(!btn)return;
  function flash(m){txt.textContent=m;setTimeout(function(){txt.textContent='Compartir'},2000)}
  function copiar(url){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(url);
    return new Promise(function(ok,fail){var t=document.createElement('textarea');t.value=url;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')?ok():fail()}catch(e){fail(e)}document.body.removeChild(t)});
  }
  btn.addEventListener('click',function(){
    var url=location.href.split('#')[0];
    if(!/^https?:/.test(url)){
      url=SHARE_URL;
      if(!url){try{url=localStorage.getItem('shareUrl')||''}catch(e){}}
      if(!url){url=(prompt('Pegue el enlace de SharePoint de este archivo (se recordará en este equipo):')||'').trim();if(!url)return;try{localStorage.setItem('shareUrl',url)}catch(e){}}
    }
    var data={title:document.title||'Presupuesto 2026 vs proyección 2027',text:'Presupuesto 2026 vs proyección 2027',url:url};
    var web=/^https?:/.test(location.href)&&window.top===window,movil=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var fb=function(){copiar(url).then(function(){flash('Enlace copiado')},function(){flash('No se pudo copiar')})};
    if(navigator.share&&web&&movil){navigator.share(data).catch(function(e){if(e&&e.name==='AbortError')return;fb()})}else fb();
  });
})();
</script>
</body></html>
